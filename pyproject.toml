[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neutron-mc-lab"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib", "pytest"]

[project.scripts]
neutron-mc-gui = "neutron_mc.gui:main"
neutron-mc-validate = "neutron_mc.validation:main"

[tool.setuptools.packages.find]
where = ["src"]